name: CI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_sfbook:
    runs-on: ubuntu-latest
    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: 安装并生成 zh_CN.UTF-8
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen zh_CN.UTF-8

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install libxml2 and libxslt
        run: sudo apt-get install libxml2-dev libxslt-dev
      # （可选）刷新字体缓存
      - name: Rebuild font cache
        run: fc-cache -f -v

      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Crawler
        run: uv run crawler.py

      - name: Build Epub
        run: uv run to_epub.py

      - name: Build PDF
        run: uv run to_pdf.py

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: main
          path: '恐吓小说网-幻影大厦.*'

  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
    needs: [build_sfbook]
    permissions:
      # 用于签署构建产物
      id-token: write
      # 用于上传 Release 附件
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Rename
        run: |
          mv 'main/恐吓小说网-幻影大厦.epub' 'main/main.epub'
          mv 'main/恐吓小说网-幻影大厦.pdf' 'main/main.pdf'
          mv 'main/恐吓小说网-幻影大厦.json' 'main/main.json'
      # 使用 softprops/action-gh-release 来附加构建产物到当前 Release
      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: 'main/main.*'
